Build Alok NetShare APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Ensure Gradlew Exists
        run: |
          # Agar android folder ke andar files hain toh wahan check karein
          TARGET_DIR="."
          if [ -d "android" ]; then
            TARGET_DIR="android"
          fi
          cd $TARGET_DIR

          # Agar gradlew file nahi hai toh wrapper banayein
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x gradlew

      - name: Build APK
        run: |
          TARGET_DIR="."
          if [ -d "android" ]; then
            TARGET_DIR="android"
          fi
          cd $TARGET_DIR
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlokNetShare-Debug-APK
          path: "**/build/outputs/apk/debug/*.apk"
          retention-days: 30
